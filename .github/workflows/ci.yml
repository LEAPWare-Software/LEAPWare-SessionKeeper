name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Unit / adapter / conformance tests
        run: python -m pytest -q

      - name: Vendor drift check (scripts/lws_build.py --check)
        run: python scripts/lws_build.py --check

      - name: Build vendor trees for validators
        run: python scripts/lws_build.py

      - name: Validate Claude Code plugin
        run: python scripts/lws_validate_claude_plugin.py

      - name: Validate Codex plugin
        run: python scripts/lws_validate_codex_plugin.py

      - name: lws-prefix (every user-facing entrypoint starts with lws)
        run: python scripts/lws_check_prefix.py

      - name: lws-hosted-runner (GitHub-hosted runners only, directive 18)
        # Not gated on pull_request: a self-hosted runner reaching main by any
        # route -- merge_group, a direct push, a workflow edited in the merge
        # queue -- is the thing being prevented, so this runs on every event.
        run: python scripts/lws_check_hosted_runner.py

      - name: lws-env-leak (no local-environment or private-project leak)
        run: python scripts/lws_check_env_leak.py

      - name: lws-env-leak-history (no leak in any commit added by this PR, even one later reverted)
        if: github.event_name == 'pull_request'
        # Same base/head reasoning as lws-commit-identity below: a
        # working-tree-only scan misses a leak that was committed and then
        # removed again within the same PR -- it is still in the branch's
        # history, which a clone or marketplace pull carries in full. No
        # allow-listed commits: every PR's added lines must be clean.
        run: >-
          python scripts/lws_check_env_leak.py
          --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: lws-no-instruction-dep (no CLAUDE.md/AGENTS.md runtime dependency)
        run: python scripts/lws_check_no_instruction_dep.py

      - name: lws-proof (proof/*.json records validate against proof/schema.json)
        run: python scripts/lws_check_proof.py

      - name: HANDOFF.md shape check
        run: python scripts/lws_handoff.py --check

      - name: lws-handoff-live (the generated block states true facts, not just valid shape)
        if: github.event_name == 'pull_request'
        # PR-only: this needs `gh` authenticated (GH_TOKEN below) and a
        # meaningful origin/main to diff the committed block's main SHA and
        # open-PR list against -- neither is guaranteed outside a PR run.
        # --pr-number excuses this PR's own number from the open-PR
        # comparison: HANDOFF.md's block is generated and committed before
        # its own PR exists, so it can never have listed it -- same
        # reasoning as the SHA lag, applied to PR numbers.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/lws_handoff.py --check-live --pr-number ${{ github.event.pull_request.number }}

      - name: lws-commit-identity (LEAPWare or an allow-listed bot only)
        if: github.event_name == 'pull_request'
        # github.event.pull_request.*.sha, not origin/<base>..HEAD: a
        # pull_request checkout's HEAD is the synthetic refs/pull/N/merge
        # commit, authored under the triggering GitHub App's own identity,
        # not a real commit on the PR branch -- checking that range flags
        # the App itself as an offending author on every PR run.
        run: >-
          python scripts/lws_check_commit_identity.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

      - name: lws-lanes (per-commit lane discipline + shared-path review gate)
        if: github.event_name == 'pull_request'
        # Same base/head reasoning as lws-commit-identity above: check the
        # PR's own real commits, never the synthetic merge commit.
        run: >-
          python scripts/lws_lanes.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --pr-number ${{ github.event.pull_request.number }}

  lwr-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run both hooks exactly as each hooks.json declares them
        run: python scripts/lws_check_hook_launch.py
